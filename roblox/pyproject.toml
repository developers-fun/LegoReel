[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "r6reel"
version = "0.1.0"
description = "Roblox R6 storytime vertical-video renderer (library + CLI)"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "moderngl"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
r6reel = "r6reel.cli:main"

[tool.setuptools]
packages = ["r6reel"]
